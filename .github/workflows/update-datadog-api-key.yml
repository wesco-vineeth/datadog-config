name: Update Datadog API Key

on:
  workflow_dispatch:
    inputs:
      target_vm:
        description: "VM folder name to update (e.g. datadog-ansible-vm-01)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-api-key:
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.VM_USER }}
      # Optional JSON map of VM folder name -> host/IP override
      VM_HOSTS: ${{ secrets.VM_HOSTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Select target VM
        id: target
        shell: bash
        env:
          TARGET_VM: ${{ inputs.target_vm }}
        run: |
          set -Eeuo pipefail

          if [[ ! "$TARGET_VM" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid VM name: $TARGET_VM"
            exit 1
          fi

          host=""
          if [[ -n "${VM_HOSTS:-}" ]]; then
            host="$(jq -r --arg vm "$TARGET_VM" '.[$vm] // empty' <<< "$VM_HOSTS")"
          fi

          # VM_HOSTS override if present, otherwise the VM name is the hostname
          echo "vm_host=${host:-$TARGET_VM}" >> "$GITHUB_OUTPUT"
          echo "vm_name=$TARGET_VM" >> "$GITHUB_OUTPUT"

      - name: Prepare API key securely
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_NEW }}
        run: |
          set -Eeuo pipefail

          test -n "$DATADOG_API_KEY"

          printf '%s' "$DATADOG_API_KEY" \
            > "$RUNNER_TEMP/datadog-api-key"

          chmod 600 "$RUNNER_TEMP/datadog-api-key"

      - name: Copy secret and deployment files to VM
        env:
          VM_HOST: ${{ steps.target.outputs.vm_host }}
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          echo "Target VM: ${{ steps.target.outputs.vm_name }}"

          ssh \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "mkdir -p \
              '$REMOTE_HOME/datadog-secret' \
              '$REMOTE_HOME/datadog-deployment/playbooks' \
              '$REMOTE_HOME/datadog-deployment/inventory' && \
             chmod 700 '$REMOTE_HOME/datadog-secret'"

          scp \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$RUNNER_TEMP/datadog-api-key" \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-secret/api_key"

          scp \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            playbooks/update-datadog-api-key.yml \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-deployment/playbooks/"

          scp \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            inventory/hosts.ini \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-deployment/inventory/"

          ssh \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "chmod 600 '$REMOTE_HOME/datadog-secret/api_key'"

      - name: Update Datadog API key
        env:
          VM_HOST: ${{ steps.target.outputs.vm_host }}
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          ssh \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "cd '$REMOTE_HOME/datadog-deployment' && \
             ansible-playbook \
               -i inventory/hosts.ini \
               playbooks/update-datadog-api-key.yml"

      - name: Verify Datadog Agent
        env:
          VM_HOST: ${{ steps.target.outputs.vm_host }}
        run: |
          set -Eeuo pipefail

          ssh \
            -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "sudo systemctl is-active datadog-agent"

      - name: Cleanup API key
        if: always()
        env:
          VM_HOST: ${{ steps.target.outputs.vm_host }}
        run: |
          rm -f "$RUNNER_TEMP/datadog-api-key"

          if [[ -n "${VM_HOST:-}" ]]; then
            ssh \
              -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/id_rsa" \
              "$VM_USER@$VM_HOST" \
              "rm -f '/home/$VM_USER/datadog-secret/api_key'" || true
          fi
