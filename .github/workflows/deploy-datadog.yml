name: Synchronize Datadog conf.d

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "azure/application-a/test/datadog-ansible-vm-01/conf.d/**"

permissions:
  contents: read

concurrency:
  group: datadog-vm-01-conf-deployment
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Detect added modified and deleted files
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"

          git diff --name-only --diff-filter=AM \
            "$BASE" "$MERGE" \
            -- "azure/application-a/test/datadog-ansible-vm-01/conf.d/" \
            | grep -E '\.ya?ml$' > present-files.txt || true

          git diff --name-only --diff-filter=D \
            "$BASE" "$MERGE" \
            -- "azure/application-a/test/datadog-ansible-vm-01/conf.d/" \
            | grep -E '\.ya?ml$' > deleted-files.txt || true

          echo "Added or modified files:"
          cat present-files.txt

          echo "Deleted files:"
          cat deleted-files.txt

          if [[ -s present-files.txt || -s deleted-files.txt ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy Ansible files to VM
        if: steps.changes.outputs.has_changes == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "mkdir -p \
              '$REMOTE_HOME/datadog-deployment/playbooks' \
              '$REMOTE_HOME/datadog-deployment/inventory' \
              '$REMOTE_HOME/datadog-staging'"

          scp -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            playbooks/deploy-changed-file.yml \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-deployment/playbooks/"

          scp -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            inventory/hosts.ini \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-deployment/inventory/"

      - name: Create or update changed files
        if: steps.changes.outputs.has_changes == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          while IFS= read -r changed_file; do
            [[ -z "$changed_file" ]] && continue

            relative_path="${changed_file#azure/application-a/test/datadog-ansible-vm-01/}"
            remote_source="$REMOTE_HOME/datadog-staging/$relative_path"
            destination_file="/etc/datadog-agent/$relative_path"

            echo "Deploying: $relative_path"

            ssh -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/id_rsa" \
              "$VM_USER@$VM_HOST" \
              "mkdir -p '$(dirname "$remote_source")'"

            scp -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/id_rsa" \
              "$changed_file" \
              "$VM_USER@$VM_HOST:$remote_source"

            ssh -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/id_rsa" \
              "$VM_USER@$VM_HOST" \
              "cd '$REMOTE_HOME/datadog-deployment' && \
               ansible-playbook \
                 -i inventory/hosts.ini \
                 playbooks/deploy-changed-file.yml \
                 --extra-vars \
                 'desired_state=present source_file=$remote_source destination_file=$destination_file'"

          done < present-files.txt

      - name: Delete removed files
        if: steps.changes.outputs.has_changes == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        shell: bash
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          while IFS= read -r deleted_file; do
            [[ -z "$deleted_file" ]] && continue

            relative_path="${deleted_file#azure/application-a/test/datadog-ansible-vm-01/}"
            destination_file="/etc/datadog-agent/$relative_path"

            echo "Deleting: $destination_file"

            ssh -o StrictHostKeyChecking=no \
              -i "$HOME/.ssh/id_rsa" \
              "$VM_USER@$VM_HOST" \
              "cd '$REMOTE_HOME/datadog-deployment' && \
               ansible-playbook \
                 -i inventory/hosts.ini \
                 playbooks/deploy-changed-file.yml \
                 --extra-vars \
                 'desired_state=absent destination_file=$destination_file'"

          done < deleted-files.txt
