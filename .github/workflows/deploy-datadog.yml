name: Synchronize Datadog conf.d

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "azure/*/*/*/conf.d/**"

permissions:
  contents: read

concurrency:
  group: datadog-conf-deployment
  cancel-in-progress: false

jobs:
  synchronize:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.VM_USER }}
      # Optional JSON map of VM folder name -> host/IP override, e.g. {"datadog-ansible-vm-03":"10.0.0.5"}
      VM_HOSTS: ${{ secrets.VM_HOSTS }}

    steps:
      - name: Checkout merged main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Detect added modified and deleted files
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"

          git diff --name-only --diff-filter=AM \
            "$BASE" "$MERGE" \
            -- \
            ':(glob)azure/*/*/*/conf.d/**' \
            | grep -E '(\.ya?ml|/\.gitkeep)$' > present-files.txt || true

          git diff --name-only --diff-filter=D \
            "$BASE" "$MERGE" \
            -- \
            ':(glob)azure/*/*/*/conf.d/**' \
            | grep -E '\.ya?ml$' > deleted-files.txt || true

          echo "Added or modified files:"
          cat present-files.txt || true

          echo "Deleted files:"
          cat deleted-files.txt || true

          if [[ -s present-files.txt || -s deleted-files.txt ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy added or modified files
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          # VM_HOSTS override if present, otherwise the VM folder name is the hostname
          resolve_host() {
            local vm_name="$1"
            local host=""

            if [[ -n "${VM_HOSTS:-}" ]]; then
              host="$(jq -r --arg vm "$vm_name" '.[$vm] // empty' <<< "$VM_HOSTS")"
            fi

            if [[ -z "$host" ]]; then
              host="$vm_name"
            fi

            printf '%s' "$host"
          }

          SSH_OPTS=(-o StrictHostKeyChecking=no -i "$HOME/.ssh/id_rsa")
          REMOTE_HOME="/home/$VM_USER"

          while IFS= read -r -u 3 changed_file; do
            [[ -z "$changed_file" ]] && continue

            # azure/<application>/<environment>/<vm_name>/conf.d/...
            application="$(echo "$changed_file" | cut -d/ -f2)"
            environment="$(echo "$changed_file" | cut -d/ -f3)"
            vm_name="$(echo "$changed_file" | cut -d/ -f4)"
            relative_path="$(echo "$changed_file" | cut -d/ -f5-)"

            VM_HOST_SELECTED="$(resolve_host "$vm_name")"

            remote_source="$REMOTE_HOME/datadog-staging/$application/$environment/$vm_name/$relative_path"
            destination_file="/etc/datadog-agent/$relative_path"

            echo "======================================"
            echo "Application : $application"
            echo "Environment : $environment"
            echo "VM          : $vm_name"
            echo "Host        : $VM_HOST_SELECTED"
            echo "File        : $relative_path"
            echo "Destination : $destination_file"
            echo "======================================"

            ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST_SELECTED" \
              "mkdir -p \
                '$REMOTE_HOME/datadog-deployment/playbooks' \
                '$REMOTE_HOME/datadog-deployment/inventory' \
                '$(dirname "$remote_source")'"

            scp "${SSH_OPTS[@]}" \
              playbooks/deploy-changed-file.yml \
              "$VM_USER@$VM_HOST_SELECTED:$REMOTE_HOME/datadog-deployment/playbooks/"

            scp "${SSH_OPTS[@]}" \
              inventory/hosts.ini \
              "$VM_USER@$VM_HOST_SELECTED:$REMOTE_HOME/datadog-deployment/inventory/"

            scp "${SSH_OPTS[@]}" \
              "$changed_file" \
              "$VM_USER@$VM_HOST_SELECTED:$remote_source"

            ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST_SELECTED" \
              "cd '$REMOTE_HOME/datadog-deployment' && \
               ansible-playbook \
                 -i inventory/hosts.ini \
                 playbooks/deploy-changed-file.yml \
                 --extra-vars \
                 'desired_state=present source_file=$remote_source destination_file=$destination_file'"

          done 3< present-files.txt

      - name: Delete removed files
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail

          resolve_host() {
            local vm_name="$1"
            local host=""

            if [[ -n "${VM_HOSTS:-}" ]]; then
              host="$(jq -r --arg vm "$vm_name" '.[$vm] // empty' <<< "$VM_HOSTS")"
            fi

            if [[ -z "$host" ]]; then
              host="$vm_name"
            fi

            printf '%s' "$host"
          }

          SSH_OPTS=(-o StrictHostKeyChecking=no -i "$HOME/.ssh/id_rsa")
          REMOTE_HOME="/home/$VM_USER"

          while IFS= read -r -u 3 deleted_file; do
            [[ -z "$deleted_file" ]] && continue

            application="$(echo "$deleted_file" | cut -d/ -f2)"
            environment="$(echo "$deleted_file" | cut -d/ -f3)"
            vm_name="$(echo "$deleted_file" | cut -d/ -f4)"
            relative_path="$(echo "$deleted_file" | cut -d/ -f5-)"

            VM_HOST_SELECTED="$(resolve_host "$vm_name")"

            destination_file="/etc/datadog-agent/$relative_path"

            echo "======================================"
            echo "Application : $application"
            echo "Environment : $environment"
            echo "VM          : $vm_name"
            echo "Host        : $VM_HOST_SELECTED"
            echo "Deleting    : $destination_file"
            echo "======================================"

            ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST_SELECTED" \
              "mkdir -p \
                '$REMOTE_HOME/datadog-deployment/playbooks' \
                '$REMOTE_HOME/datadog-deployment/inventory'"

            scp "${SSH_OPTS[@]}" \
              playbooks/deploy-changed-file.yml \
              "$VM_USER@$VM_HOST_SELECTED:$REMOTE_HOME/datadog-deployment/playbooks/"

            scp "${SSH_OPTS[@]}" \
              inventory/hosts.ini \
              "$VM_USER@$VM_HOST_SELECTED:$REMOTE_HOME/datadog-deployment/inventory/"

            ssh "${SSH_OPTS[@]}" "$VM_USER@$VM_HOST_SELECTED" \
              "cd '$REMOTE_HOME/datadog-deployment' && \
               ansible-playbook \
                 -i inventory/hosts.ini \
                 playbooks/deploy-changed-file.yml \
                 --extra-vars \
                 'desired_state=absent destination_file=$destination_file'"

          done 3< deleted-files.txt
