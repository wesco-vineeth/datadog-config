name: Deploy Changed Datadog Config

on:
  push:
    branches:
      - main
    paths:
      - "datadog-ansible-vm-01/**"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Detect changed configuration files
        id: changed
        shell: bash
        run: |
          git diff --name-only --diff-filter=AM HEAD^ HEAD \
            -- "datadog-ansible-vm-01/**" \
            | grep -E '\.ya?ml$' > changed-files.txt || true

          echo "Changed configuration files:"
          cat changed-files.txt

          if [ -s changed-files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy playbook and inventory to VM
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "mkdir -p ~/datadog-deployment/playbooks \
                      ~/datadog-deployment/inventory \
                      ~/datadog-staging"

          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            playbooks/deploy-changed-file.yml \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/datadog-deployment/playbooks/"

          scp -o StrictHostKeyChecking=no \
            -i ~/.ssh/id_rsa \
            inventory/hosts.ini \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:~/datadog-deployment/inventory/"

      - name: Deploy only changed files
        if: steps.changed.outputs.has_changes == 'true'
        shell: bash
        run: |
          set -e

          while IFS= read -r changed_file; do
            relative_path="${changed_file#datadog-ansible-vm-01/}"
            staged_file="$HOME/datadog-staging/$relative_path"
            destination_file="/etc/datadog-agent/$relative_path"

            echo "Changed file: $changed_file"
            echo "VM destination: $destination_file"

            ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "mkdir -p \"\$(dirname \"$staged_file\")\""

            scp -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              "$changed_file" \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:$staged_file"

            ssh -o StrictHostKeyChecking=no \
              -i ~/.ssh/id_rsa \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "cd ~/datadog-deployment && \
               ansible-playbook \
                 -i inventory/hosts.ini \
                 playbooks/deploy-changed-file.yml \
                 --extra-vars \
                 staged_file="/home/azureuser/datadog-staging/$relative_path"

          done < changed-files.txt
