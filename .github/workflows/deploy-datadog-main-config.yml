name: Deploy Main Datadog Configuration

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "azure/application-a/test/datadog-ansible-vm-01/datadog.yaml"
      - "azure/application-a/prod/datadog-ansible-vm-02/datadog.yaml"

permissions:
  contents: read

concurrency:
  group: datadog-main-config-deployment
  cancel-in-progress: false

jobs:
  deploy-main-config:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.VM_USER }}

      VM_01_HOST: ${{ secrets.VM_HOST }}
      VM_02_HOST: ${{ secrets.VM02_HOST }}

      VM_01_DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_OLD }}
      VM_02_DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY_NEW }}

    steps:
      - name: Checkout merged main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Detect changed datadog.yaml files
        id: changes
        shell: bash
        run: |
          set -Eeuo pipefail

          BASE="${{ github.event.pull_request.base.sha }}"
          MERGE="${{ github.event.pull_request.merge_commit_sha }}"

          git diff --name-only --diff-filter=AM \
            "$BASE" "$MERGE" \
            -- \
            "azure/application-a/test/datadog-ansible-vm-01/datadog.yaml" \
            "azure/application-a/prod/datadog-ansible-vm-02/datadog.yaml" \
            > changed-main-configs.txt

          echo "Changed main configuration files:"
          cat changed-main-configs.txt || true

          if [[ -s changed-main-configs.txt ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy changed datadog.yaml files
        if: steps.changes.outputs.has_changes == 'true'
        shell: bash
    
