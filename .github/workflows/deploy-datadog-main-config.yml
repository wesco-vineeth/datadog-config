name: Deploy Main Datadog Configuration

on:
  pull_request:
    branches:
      - main
    types:
      - closed
    paths:
      - "azure/application-a/test/datadog-ansible-vm-01/datadog.yaml"

permissions:
  contents: read

concurrency:
  group: datadog-vm-01-main-config
  cancel-in-progress: false

jobs:
  deploy-main-config:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -Eeuo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VM_SSH_KEY" > "$HOME/.ssh/id_rsa"
          chmod 600 "$HOME/.ssh/id_rsa"

      - name: Render datadog.yaml securely
        env:
          DATADOG_API_KEY: ${{ secrets.DATADOG_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          test -n "$DATADOG_API_KEY"

          python3 - <<'PY'
          import os
          from pathlib import Path

          source = Path(
              "azure/application-a/test/datadog-ansible-vm-01/datadog.yaml"
          )

          destination = Path(
              os.environ["RUNNER_TEMP"]
          ) / "datadog.yaml"

          content = source.read_text()

          placeholder = "${DATADOG_API_KEY}"

          if content.count(placeholder) != 1:
              raise SystemExit(
                  "datadog.yaml must contain exactly one "
                  "${DATADOG_API_KEY} placeholder"
              )

          content = content.replace(
              placeholder,
              os.environ["DATADOG_API_KEY"]
          )

          destination.write_text(content)
          destination.chmod(0o600)
          PY

      - name: Copy main-config playbook and rendered config
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "mkdir -p \
              '$REMOTE_HOME/datadog-deployment/playbooks' \
              '$REMOTE_HOME/datadog-deployment/inventory' \
              '$REMOTE_HOME/datadog-staging/main-config'"

          scp -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            playbooks/deploy-datadog-main-config.yml \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-deployment/playbooks/"

          scp -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            inventory/hosts.ini \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-deployment/inventory/"

          scp -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$RUNNER_TEMP/datadog.yaml" \
            "$VM_USER@$VM_HOST:$REMOTE_HOME/datadog-staging/main-config/datadog.yaml"

          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "chmod 600 \
              '$REMOTE_HOME/datadog-staging/main-config/datadog.yaml'"

      - name: Deploy datadog.yaml
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          set -Eeuo pipefail

          REMOTE_HOME="/home/$VM_USER"

          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "cd '$REMOTE_HOME/datadog-deployment' && \
             ansible-playbook \
               -i inventory/hosts.ini \
               playbooks/deploy-datadog-main-config.yml \
               --extra-vars \
               'source_file=$REMOTE_HOME/datadog-staging/main-config/datadog.yaml'"

      - name: Verify Datadog Agent
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/id_rsa" \
            "$VM_USER@$VM_HOST" \
            "sudo systemctl is-active datadog-agent"
