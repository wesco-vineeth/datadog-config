---
- hosts: datadog
  become: true

  tasks:

    - name: Copy datadog.yaml
      copy:
        src: ../datadog-ansible-vm-01/datadog.yaml
        dest: /etc/datadog-agent/datadog.yaml

    - name: Validate Datadog config
      command: datadog-agent configcheck

    - name: Restart Datadog Agent
      service:
        name: datadog-agent
        state: restarted
