---
- name: Deploy main Datadog configuration
  hosts: datadog
  become: true
  gather_facts: false

  tasks:
    - name: Validate source file
      ansible.builtin.assert:
        that:
          - source_file is defined
          - source_file | length > 0

    - name: Check existing datadog.yaml on the server
      ansible.builtin.stat:
        path: /etc/datadog-agent/datadog.yaml
      register: current_config

    - name: Read existing datadog.yaml
      ansible.builtin.slurp:
        src: /etc/datadog-agent/datadog.yaml
      register: current_config_content
      when: current_config.stat.exists
      no_log: true

    - name: Find the api_key line currently on the server
      ansible.builtin.set_fact:
        preserved_api_key_line: >-
          {{
            (current_config_content.content | b64decode)
            | regex_search('(?m)^api_key:.*$')
            | default('', true)
          }}
      when: current_config.stat.exists
      no_log: true

    - name: Keep the server's api_key in the staged file
      ansible.builtin.lineinfile:
        path: "{{ source_file }}"
        regexp: '^api_key:.*$'
        line: "{{ preserved_api_key_line }}"
        backup: false
      when:
        - current_config.stat.exists
        - preserved_api_key_line | default('') | length > 0
      no_log: true

    - name: Deploy datadog.yaml
      ansible.builtin.copy:
        src: "{{ source_file }}"
        dest: /etc/datadog-agent/datadog.yaml
        remote_src: true
        owner: dd-agent
        group: dd-agent
        mode: "0640"
        backup: false
      register: main_config_result
      no_log: true

    - name: Validate Datadog configuration
      ansible.builtin.command:
        cmd: datadog-agent configcheck
      changed_when: false
      no_log: true

    - name: Restart Datadog Agent
      ansible.builtin.service:
        name: datadog-agent
        state: restarted
      when: main_config_result.changed

    - name: Verify Datadog Agent
      ansible.builtin.command:
        cmd: systemctl is-active datadog-agent
      register: agent_status
      changed_when: false

    - name: Confirm Datadog Agent is active
      ansible.builtin.assert:
        that:
          - agent_status.stdout == "active"

    - name: Remove staged datadog.yaml
      ansible.builtin.file:
        path: "{{ source_file }}"
        state: absent
      no_log: true
