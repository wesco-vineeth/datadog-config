---
- name: Update Datadog API key
  hosts: datadog
  become: true
  gather_facts: false

  vars:
    api_key_file: "/home/azureuser/datadog-secret/api_key"

  tasks:
    - name: Check temporary API key file
      ansible.builtin.stat:
        path: "{{ api_key_file }}"
      register: api_key_file_status
      no_log: true

    - name: Confirm API key file exists
      ansible.builtin.assert:
        that:
          - api_key_file_status.stat.exists
          - api_key_file_status.stat.size > 0
        fail_msg: "Temporary Datadog API key file is missing or empty."
      no_log: true

    - name: Read API key
      ansible.builtin.slurp:
        src: "{{ api_key_file }}"
      register: api_key_content
      no_log: true

    - name: Store API key securely in memory
      ansible.builtin.set_fact:
        datadog_api_key: "{{ api_key_content.content | b64decode | trim }}"
      no_log: true

    - name: Update API key in datadog.yaml
      ansible.builtin.lineinfile:
        path: /etc/datadog-agent/datadog.yaml
        regexp: '^[[:space:]]*api_key:'
        line: "api_key: {{ datadog_api_key }}"
        owner: dd-agent
        group: dd-agent
        mode: "0640"
        backup: false
      register: api_key_update
      no_log: true

    - name: Delete temporary API key file
      ansible.builtin.file:
        path: "{{ api_key_file }}"
        state: absent
      no_log: true

    - name: Restart Datadog Agent
      ansible.builtin.service:
        name: datadog-agent
        state: restarted
      when: api_key_update.changed

    - name: Verify Datadog Agent
      ansible.builtin.command:
        cmd: systemctl is-active datadog-agent
      register: agent_status
      changed_when: false

    - name: Confirm Datadog Agent is active
      ansible.builtin.assert:
        that:
          - agent_status.stdout == "active"
