---
- name: Deploy or delete one Datadog configuration file
  hosts: datadog
  become: true
  gather_facts: false

  tasks:

    - name: Delete file if removed from GitHub
      file:
        path: "{{ destination_file }}"
        state: absent
      when: desired_state == "absent"

    - name: Copy changed file
      copy:
        src: "{{ source_file }}"
        dest: "{{ destination_file }}"
        remote_src: true
        owner: dd-agent
        group: dd-agent
        mode: "0640"
      when: desired_state == "present"

    - name: Restart Datadog Agent
      service:
        name: datadog-agent
        state: restarted
