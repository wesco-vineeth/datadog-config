---
- name: Deploy only changed Datadog configuration file
  hosts: datadog
  become: true
  gather_facts: false

  tasks:
    - name: Copy changed file
      copy:
        src: "{{ source_file }}"
        dest: "{{ destination_file }}"
        remote_src: true
        owner: dd-agent
        group: dd-agent
        mode: "0640"

    - name: Validate Datadog configuration
      command: datadog-agent configcheck
      changed_when: false

    - name: Restart Datadog Agent
      service:
        name: datadog-agent
        state: restarted

    - name: Verify Datadog Agent
      command: systemctl is-active datadog-agent
      changed_when: false
